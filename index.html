<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chotu ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 15% 20%,
                rgba(255,255,255,0.8) 0 2px,
                transparent 3px),
                radial-gradient(circle at 80% 30%,
                rgba(255,255,255,0.7) 0 2px,
                transparent 3px),
                radial-gradient(circle at 30% 80%,
                rgba(255,255,255,0.7) 0 2px,
                transparent 3px),
                linear-gradient(
                    135deg,
                    #ffdce8,
                    #f8b7cd,
                    #ffdce8
                );
            background-size:
                180px 180px,
                230px 230px,
                260px 260px,
                cover;
        }

        /* Soft glowing center */
        .glow {
            position: absolute;
            width: 75vmin;
            height: 75vmin;
            border-radius: 50%;
            background: rgba(255,255,255,0.28);
            filter: blur(30px);
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 2;
            width: 88vw;
            max-width: 620px;
            min-height: 55vh;
            padding: 60px 25px;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow:
                0 20px 60px
                rgba(170,70,105,0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Small message */
        .tiny {
            font-size: clamp(16px, 3vw, 21px);
            color: #9f3c5e;
            letter-spacing: 3px;
            margin-bottom: 22px;
            animation:
                fade 1.6s ease both;
        }

        /* Main message */
        h1 {
            margin: 0;
            color: #b51f48;
            font-size: clamp(
                42px,
                10vw,
                78px
            );
            line-height: 1.05;
            font-weight: 700;
            text-shadow:
                0 5px 18px
                rgba(181,31,72,0.15);
            animation:
                pop 1.3s
                cubic-bezier(.2,.8,.2,1)
                .3s both;
        }

        /* Red heart */
        .heart {
            display: inline-block;
            color: #e51f3f;
            font-size: 1em;
            margin-left: 8px;
            animation:
                heartbeat 1.2s
                ease-in-out
                infinite;
        }

        /* Bottom message */
        .sub {
            margin-top: 28px;
            color: #a44c68;
            font-size: clamp(
                14px,
                3vw,
                18px
            );
            letter-spacing: 1px;
            animation:
                fade 1.5s ease 1s both;
        }

        /* Floating hearts */
        .heart-float {
            position: absolute;
            bottom: -40px;
            color: rgba(255,255,255,0.75);
            font-size: 22px;
            animation:
                floatUp
                linear
                infinite;
            pointer-events: none;
        }

        /* Opening animation */
        @keyframes pop {
            0% {
                opacity: 0;
                transform:
                    scale(0.55)
                    translateY(20px);
            }
            70% {
                opacity: 1;
                transform:
                    scale(1.08);
            }
            100% {
                opacity: 1;
                transform:
                    scale(1);
            }
        }

        /* Fade animation */
        @keyframes fade {
            from {
                opacity: 0;
                transform:
                    translateY(12px);
            }
            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        /* Heartbeat */
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.2);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.12);
            }
            60% {
                transform: scale(1);
            }
        }

        /* Floating animation */
        @keyframes floatUp {
            from {
                transform:
                    translateY(0)
                    rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            to {
                transform:
                    translateY(-110vh)
                    rotate(35deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="card">
        <div class="tiny">
            A little surprise for you...
        </div>
        <h1>
            I love you<br>
            Chotu
            <span class="heart">♥</span>
        </h1>
        <div class="sub">
            Always. Forever. ❤️
        </div>
    </div>

    <script>
        const symbols = [
            "♡",
            "♥",
            "✦",
            "♡",
            "♥"
        ];

        for (let i = 0; i < 24; i++) {
            const heart =
                document.createElement("div");
            heart.className =
                "heart-float";
            heart.textContent =
                symbols[
                    Math.floor(
                        Math.random()
                        * symbols.length
                    )
                ];
            heart.style.left =
                Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (7 + Math.random() * 9) + "s";
            heart.style.animationDelay =
                (-Math.random() * 12) + "s";
            heart.style.fontSize =
                (14 + Math.random() * 18) + "px";
            document.body.appendChild(heart);
        }
    </script>

</body>
</html>
